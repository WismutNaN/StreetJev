[project]
name = "streetjev"
version = "0.1.0"
description = "Настольная карта географических гипотез по серии снимков экрана"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "mss>=10,<11",
    "pillow>=11,<13",
    "pyside6>=6.8,<7",
    "shapely>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "shapely>=2,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.scripts]
streetjev = "streetjev.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/streetjev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py312"
